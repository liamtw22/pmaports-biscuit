# Your EQ. Parametric peaking filters applied BEFORE the speaker correction,
# mirroring where stock puts its own UserEQ stage.
#
#   peak <frequency_hz> <q> <gain_db>
#
# One per line, up to 16. Ships empty, so the device sounds as tuned.
# Apply changes without restarting:  echo reload > /run/biscuit-dsp/control
#
# Saving an EQ from the settings page or Home Assistant REPLACES this file,
# edits and comments included, with that EQ's bands. A reboot leaves a file
# with your own peak lines alone.
#
# Examples — remove the leading '#' to use:
#
# peak 120 1.0 -3.0     # less bass
# peak 3000 1.5 +2.0    # more presence for speech
#
# Deep cuts are safe. Large boosts are not: they land on top of a correction
# curve that is already +24 dB in the bass, and the limiter will simply eat
# them, making everything quieter rather than louder.
