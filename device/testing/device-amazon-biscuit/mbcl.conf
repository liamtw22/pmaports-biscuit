# Biscuit playback dynamics — 4-band compressor/limiter plus a full-band
# limiter. Values were measured from the stock firmware's playback tuning
# unless marked (see PROVENANCE.md).
#
# THIS IS THE DRIVER'S PROTECTION. The speaker correction curve (the owner's
# imported EQ_50.cfg, when present) applies up to +24 dB between
# 120 and 300 Hz; band 1 below is what keeps that from wrecking the speaker.
# Raising band1_thresh_db, band1_lim_thresh_db, or setting bypass=1 while the
# correction curve is loaded removes that protection.
#
# Reload without restarting:  echo reload > /run/biscuit-dsp/control

bypass = 0

# Where the volume taper is applied.
#   1 = after the limiter (default). Every halving of the volume number is
#       exactly 10 dB on any material. Applied before MBCL the compressors
#       simply hand the taper back: at volume 100 the chain runs 11.5 dB into
#       limiting, so a 10 dB cut moved an earcon by 0.84 dB.
#   0 = the old pre-MBCL behaviour. The dynamics ease off at low volume
#       (about 2 dB more crest factor on mid-level content), but the top half
#       of the slider does very little.
volume_after_limiter = 1

in_gain_db = 0

# Crossovers (Hz). Bands are 0-fc1, fc1-fc2, fc2-fc3, fc3-nyquist.
fc1 = 115
fc2 = 500
fc3 = 7500

# Band 1 (bass) — heavy on purpose. Ratio 20:1 from -50 dBFS means it is
# compressing almost all the time; that is the point.
band1_thresh_db = -50
band1_ratio = 20
band1_gain_min_db = -40
band1_lim_thresh_db = -8
band1_lim_release_ms = 200

band2_thresh_db = -10
band2_ratio = 2
band2_gain_min_db = -40
band2_lim_thresh_db = 0
band2_lim_release_ms = 1

band3_thresh_db = -10
band3_ratio = 2
band3_gain_min_db = -40
band3_lim_thresh_db = 0
band3_lim_release_ms = 1

band4_thresh_db = -10
band4_ratio = 2
band4_gain_min_db = -40
band4_lim_thresh_db = 0
band4_lim_release_ms = 1

full_lim_thresh_db = -0.1
full_lim_release_ms = 200

# Per-volume loudness push, applied after the correction curve.
#
# Stock ships six per-volume EQ files; measured, all four distinct ones are the
# SAME magnitude shape to within 0.000 dB and differ only by a scalar. So this
# is stock's "per-volume voicing" reproduced honestly: it is level, not tone.
# Volumes below 75 get no push.
push_80_db = 3.53
push_90_db = 7.55
push_100_db = 14.55

# Stock gain staging: do not attenuate the protected DSP output after MBCL.
output_trim_db = 0.0
