# What each reset option on the settings page erases.
#
# Installed to /usr/share/biscuit/reset.conf. biscuit-persist carries a reset
# out at the next boot, before anything reads the store, and the settings page
# lists these lines in its "this will erase" dialog - one list, so the two
# cannot disagree about what a reset does.
#
#     scope  path  description
#
# scope     settings | network | all. A reset of "all" (erase everything) takes
#           every line; "settings" and "network" take only their own.
# path      relative to /opt/persist, or absolute for a file on the rootfs. A
#           directory is emptied, not removed, because some are bind targets.
# description   what the person loses, as the page shows it.
#
# update-feed is not just removed: biscuit-persist writes "on" in its place, so
# the feed comes back however it was turned off, a commented-out line included.
#
# apps-pending goes with "all" only. It holds the apps ticked at setup that are
# not installed yet, and the settings page keeps trying to install them. Erasing
# everything hands the Echo to a new owner, whose setup asks about apps afresh -
# and a setup where nothing is ticked leaves the file alone, so without this
# line the last owner's choice would be installed on the new owner's device
# without them being asked. A settings or network reset keeps the same owner,
# and so keeps the choice.
#
# Never listed, and so never erased by any reset: biscuit/assets, biscuit/led,
# earcon and fireos6 - this Echo's own firmware, microphone files, ring
# animations and sounds, copied from its backup. Without the firmware it has no
# Wi-Fi, and none of them can be downloaded again.

settings  volume                      Volume
settings  eq.json                     Equaliser
settings  duck.json                   Turning other audio down while listening
settings  earcon-set                  Sound set
settings  sound-map.json              Individual sounds
settings  mic.env                     Microphone processing and tuning
settings  mic-lastgood                Last working microphone setting
settings  miccal-mode                 Microphone calibration choice
settings  miccal-manual               Manual microphone calibration
settings  mic-led                     Microphone light
settings  mute-led                    Mute light
settings  call-stock.json             Imported call tuning (re-imported from the backup)
settings  autodim                     Ring dimming with the room
settings  ring-brightness             Ring brightness
settings  ring-palette.json           Ring Colour 2 and 3
settings  ring-alignment.json         Direction pointer alignment
settings  led-map.json                Ring animations
settings  led-anim.env                Ring animations
settings  ha-light.json               Light ring colour and effect from Home Assistant
settings  viz.conf                    Music visualiser
settings  buttons.json                Action button
settings  usb-mode                    What a computer sees over USB
settings  btcast                      Playing through a Bluetooth speaker
settings  btproxy.env                 Bluetooth proxy
settings  services                    Apps turned off or paused
settings  voice-assistant-prefs.json  Voice assistant preferences
settings  sendspin                    Music speaker's remembered server
settings  timezone                    Time zone
settings  settings-port               The settings page's address (back to :8080)
settings  update-check                Whether updates are checked daily
settings  update-feed                 The update feed turned off (it comes back on)

network   wpa_supplicant              Saved Wi-Fi networks and passwords
network   bluetooth                   Bluetooth pairings

all       provisioned                 The owner account
all       account                     The owner account's saved copy
all       ssh                         SSH keys and this device's SSH identity
all       etc                         Device name
all       region                      Wi-Fi region
all       apps-pending                Apps chosen at setup that are not installed yet
