# The USB host may stop its isochronous clock without removing the ALSA card.
# Such an endpoint must never clock the Echo's microphone or speaker graph.
# Keep resampling enabled so the gadget follows the local audio clock.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.platform-musb-hdrc.*" }
      { node.name = "~alsa_output.platform-musb-hdrc.*" }
    ]
    actions = {
      update-props = {
        priority.driver = -1000
        # ... and it must never become the DEFAULT sink or source either.
        # priority.driver only stops it clocking the graph; the default
        # device is chosen on priority.session, which defaults to 1000 for
        # an ALSA device and so silently outranked biscuit_speaker.
        priority.session = -1000
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.platform-musb-hdrc.*" }
    ]
    actions = {
      update-props = {
        # USB OUT packets arrive in bursts. The default 32-frame margin
        # allowed capture to run ahead and insert whole silent quanta.
        # 512 frames (10.7 ms at 48 kHz) kept the captured tone continuous.
        api.alsa.headroom = 512
      }
    }
  }
]
