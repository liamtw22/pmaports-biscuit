# SSH policy for the setup network and the shipped default account.
# Installed as /etc/ssh/sshd_config.d/40-biscuit.conf.
#
# WHY THIS EXISTS
#
# Setup mode broadcasts an OPEN network (biscuit-setup.sh: no wpa= line, so
# anyone in radio range can join), and before setup the image carries
# postmarketOS's published default account, user / 147147, which is in wheel
# with passwordless sudo. Without this file those three facts add up to root
# for anyone within Wi-Fi range of a device that is being set up.
#
# Nothing on the setup network needs SSH. The phone doing the setup only ever
# talks to the portal on port 80, so every SSH login from that network is
# refused outright, for every account, whether or not the device has been set
# up before - setup can be re-entered on a working device, and its owner's
# account is no business of the open network either.
#
# WHY sshd AND NOT A FIREWALL: the image has no iptables or nft userspace, and
# a firewall that is only as good as a rule loaded at the right moment is a
# worse guarantee than the daemon itself refusing. sshd evaluates this for
# every connection, including ones that arrive while setup is starting up.
#
# WHY sshd STAYS RUNNING DURING SETUP: setup is re-entered on working devices
# (button, Home Assistant over SSH on the house network, which stays joined),
# and USB networking is the recovery path while it runs. Stopping sshd would
# take both away to protect one network that this file closes anyway.
#
# HOW THE MATCHES WORK: a Match applies when ALL of its criteria hold, and for
# a keyword set by more than one satisfied Match the first one wins. Settings
# in a satisfied Match override the global ones in /etc/ssh/sshd_config, which
# is what the settings page edits - so its password on/off toggle keeps
# working for every connection these blocks do not cover.

# ONE WAY TO TYPE A PASSWORD, not two. sshd here is the PAM build (UsePAM yes,
# from postmarketOS's 50-postmarketos-ui-policy.conf) and its PAM auth stack is
# pam_unix, so keyboard-interactive accepts the account password exactly as
# the "password" method does. The settings page's "password sign-in off"
# switch writes PasswordAuthentication only, which left keyboard-interactive
# accepting the same password - the switch did not do what it said. With this
# off, PasswordAuthentication is the only password path, and that switch (and
# the Match blocks below) govern it completely. Every OpenSSH, PuTTY and
# Paramiko client offers the "password" method, so nothing that logs in with a
# password today stops working. Global, and above every Match: this file is
# included before the main sshd_config, and the first value obtained wins.
KbdInteractiveAuthentication no

# Anything arriving on the setup AP's own address (biscuit-setup.sh ADDR).
# Static, because nothing but the setup network ever puts this address on the
# device, so it costs nothing outside setup and holds even if the runtime rule
# below could not be written.
Match LocalAddress 192.168.4.1
	DenyUsers *
	PasswordAuthentication no
	KbdInteractiveAuthentication no
	PubkeyAuthentication no

# Runtime rules, from /run (tmpfs, so nothing in it outlives a boot):
#
#   setup-network.conf   biscuit-setup.sh, for exactly as long as the setup
#       network is up: every login from the setup SUBNET is refused, whatever
#       local address it asks for. Linux answers for every local address on
#       every interface, so a setup client routing via 192.168.4.1 could
#       otherwise reach port 22 on the device's house-network or USB address
#       and arrive with LocalAddress set to those. (Setup also turns on strict
#       reverse-path filtering on the setup interface, so a client spoofing a
#       source outside the subnet is dropped by the kernel, and turns IPv6 off
#       on it, so there is no link-local route either.) It is NOT static:
#       192.168.4.0/24 is also an ordinary home LAN (eero's default is
#       192.168.4.0/22), and a static rule would lock those owners out of SSH
#       for good.
#
#   default-account.conf   biscuit-firstboot at boot, rewritten by
#       biscuit-setup.sh when setup replaces the account: while the shipped
#       default account still has the published password, password logins for
#       it are refused everywhere except over the USB cable. Decided from the
#       account's actual password hash, so an owner who chose the name "user"
#       during setup, with a password of their own, is not affected.
#
# An Include whose pattern matches nothing is not an error.
Match all
Include /run/biscuit-sshd/*.conf

# Back to global scope, so nothing after this file lands inside a Match.
Match all
