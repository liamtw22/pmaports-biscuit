# A reference clock fed by biscuit-timesync from Home Assistant's Date header.
#
# Dropped into /etc/chrony/conf.d rather than edited into chrony.conf, because
# that file belongs to Alpine's chrony package and an upgrade would take our
# edit with it. `confdir /etc/chrony/conf.d` is already in the shipped config.
#
# precision 1.0 is the honest figure, not a pessimistic one. Two things add up:
# the Date header is truncated to the second, and the header is stamped
# somewhere inside the request, so taking the midpoint of the round trip costs
# up to RTT/2 more. Home Assistant answers a HEAD on / in about a second, so a
# second of combined uncertainty is the truthful number.
# Declaring it truthfully is what makes chrony prefer a real NTP server the
# moment one becomes reachable - selection is on merit, so this source wins only
# when it is the only source.
#
# poll 6 is 64 seconds, matching SAMPLE_INTERVAL_S in biscuit-timesync.
# filter 3 takes the median of three samples, which suppresses the occasional
# one skewed by an asymmetric round trip.
#
# stratum 10 keeps the device honest about what it is. Without it a refclock
# implies stratum 0 and the device would advertise itself as stratum 1 - a
# claim to be a primary time standard, on the strength of an HTTP header.
refclock SOCK /run/chrony/httpdate.sock refid HTTP precision 1.0 poll 6 filter 3 stratum 10
