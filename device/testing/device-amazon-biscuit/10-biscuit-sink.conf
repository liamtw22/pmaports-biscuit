# Two static nodes on the snd-aloop cables. PipeWire must NEVER touch hw:0,0 -
# biscuit-dsp owns the codec, and whichever of the two opens it first keeps it.
#
#   apps -> biscuit_speaker -> hw:Loopback,0,0 ==aloop== hw:Loopback,1,0 -> biscuit-dsp -> hw:0,0
#   biscuit-mic-pump -> hw:Loopback,1,0 ==aloop== hw:Loopback,0,0 -> biscuit_mic -> assistant
#
# Both nodes name hw:Loopback,0,0 because snd-aloop is full duplex on one
# subdevice pair: what is played to device 0 appears as capture on device 1 and
# vice versa. The sink is the playback half, the source the capture half.
context.objects = [
    {   factory = adapter
        args = {
            factory.name         = api.alsa.pcm.sink
            node.name            = "biscuit_speaker"
            node.description     = "Biscuit speaker"
            media.class          = "Audio/Sink"
            api.alsa.path        = "hw:Loopback,0,0"
            audio.format         = "S16LE"
            audio.rate           = 48000
            audio.channels       = 2
            api.alsa.period-size = 1024
            api.alsa.headroom    = 8192
            node.pause-on-idle   = false
            # priority.session is what picks the DEFAULT sink, and it is
            # a different number from priority.driver, which only decides
            # who clocks the graph. This node had no session priority at
            # all, so when the USB gadget appeared with the ALSA default
            # of 1000 it took the default sink - and every ALSA client
            # opening "default" went to an endpoint that passes no data.
            priority.session     = 2000
        }
    }
    {   factory = adapter
        args = {
            factory.name         = api.alsa.pcm.source
            node.name            = "biscuit_mic"
            node.description     = "Biscuit microphone"
            media.class          = "Audio/Source"
            api.alsa.path        = "hw:Loopback,0,0"
            audio.format         = "S16LE"
            audio.rate           = 16000
            audio.channels       = 1
            api.alsa.period-size = 1024
            node.pause-on-idle   = false
            # Same reasoning for the capture side.
            priority.session     = 2000
        }
    }
]
