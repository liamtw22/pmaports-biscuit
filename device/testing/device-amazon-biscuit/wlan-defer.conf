# Stop udev autoloading the WLAN driver at boot; wifi.start loads it instead.
#
# The module carries a MODULE_DEVICE_TABLE, so udev loaded it at t~9-16 s and
# wlanProbe failed on most boots with "Waiting for Ready bit: Timeout,
# FailReason: 4" - measured, roughly 1 boot in 4 produced wlan0. Deferring the
# load into wifi.start took that to 9 boots in 11.
#
# Wi-Fi and Bluetooth share one CONSYS block and BT/WMT enables the WMT Wi-Fi
# function at t~1.7 s, so loading this early evidently catches the chip in a
# state the firmware download cannot recover from. Every documented successful
# bring-up was a manual insmod well after boot.
#
# `install ... /bin/true` rather than `blacklist`: blacklist was tried and does
# NOT prevent udev loading this module. The consequence is that plain
# `modprobe wlan_mt6625l` is now a no-op, which is why wifi.start uses insmod
# with a full path.
install wlan_mt6625l /bin/true
