# Load the pstore RAM backend at boot.
#
# CONFIG_PSTORE_RAM is =m, so nothing registers a backend until this module is
# loaded - and it has to be loaded BEFORE a crash, not after, because pstore
# installs its kmsg dumper at probe time. A module loaded only when someone
# goes looking is worth nothing for the event that already happened.
#
# The reserved region comes from the device tree (ramoops@5c800000, kernel
# patch 0123). Without it this module loads and registers no backend at all,
# silently: pstore's backend parameter reads (null) and /sys/fs/pstore stays
# empty, which is exactly how the device looked before.
ramoops
