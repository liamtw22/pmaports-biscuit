# pymicro-features is the one entry here that is not a PyPI version or a git
# commit. It used to read:
#
#   pymicro-features @ file:///tmp/pymicro_features-2.0.2-cp39-abi3-linux_aarch64.whl#sha256=c652c460...
#
# which recorded a path on one machine at one moment rather than a source. The
# file is gone - /tmp on the device has since been reclaimed entirely - so the
# line documented nothing a rebuild could act on.
#
# The installed wheel's own metadata says what it really is: its WHEEL tag is
# cp39-abi3-linux_aarch64, a bare linux_* platform tag, which PyPI does not
# accept for upload. So it was built locally for this rootfs rather than
# downloaded, from the upstream below, and the sha256 is what identifies it.
#
#   upstream: https://github.com/rhasspy/pymicro-features  (2.0.2)
#   artifact: sha256 c652c4606b9088afb1ee5cc3c267263fdf116364622f38b62f7e92a665a9de20
#
# Naming the version means a rebuild resolves the real project instead of
# failing on a missing file.
pymicro-features==2.0.2
pymicro-wakeword==2.4.1
# pyopen-wakeword stays because linux-voice-assistant imports it, but since
# r294 the bundle does not carry openWakeWord's pretrained wake-word models
# (CC BY-NC-SA 4.0) or either package's x86-64 glibc libtensorflowlite_c.so.
# A venv rebuilt from this file must delete them again:
#   site-packages/wakewords/openWakeWord/
#   site-packages/pyopen_wakeword/models/ (all but melspectrogram.tflite and
#     embedding_model.tflite)
#   site-packages/pyopen_wakeword/lib/libtensorflowlite_c.so
#   site-packages/pymicro_wakeword/lib/libtensorflowlite_c.so.glibc
# and add linux-voice-assistant/THIRD_PARTY_LICENSES/. The APKBUILD refuses
# to package a venv that still has the models.
pyopen-wakeword==1.1.0
