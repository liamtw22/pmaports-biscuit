# One address, always the same one, for whatever computer is on the other end
# of the USB cable.
#
# WHY THIS EXISTS
#
# The device puts 172.16.42.1/24 on its USB interface and nothing hands the
# host an address, so the host side has to be configured by hand - a static IP
# that needs administrator rights on Windows and does not survive the adapter
# being reset. It did not survive: mid-session Windows reset the adapter, the
# static address vanished, and the USB link - the only way in when Wi-Fi is
# down - went with it.
#
# Serving one lease removes that entirely. Plug the device into any computer
# and the link configures itself.
#
# It deliberately advertises NO router and NO DNS. This link is for reaching
# the device, not for routing the host's traffic through it; a default route
# here would quietly hijack the host's networking.
#
# INTERFACE NAME IS SUBSTITUTED AT RUNTIME
#
# The placeholder below is replaced with whichever interface the RNDIS gadget
# actually created. That is not always usb0: the pmOS initramfs brings up its
# own g1 gadget first, and when usb-rndis later binds the real one the kernel
# often allocates usb1, leaving a dead usb0 behind with the same address on it.
# Serving DHCP on the dead one produces exactly the symptom this file exists to
# fix, so the name is never hardcoded.
interface	@IFACE@
start		172.16.42.2
end		172.16.42.2
max_leases	1
option	subnet	255.255.255.0
opt		lease	86400
lease_file	/var/lib/misc/udhcpd.@IFACE@.leases
pidfile		/run/udhcpd.@IFACE@.pid
