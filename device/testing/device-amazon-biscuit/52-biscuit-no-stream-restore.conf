# Do not remember per-application stream volumes.
#
# This device has ONE volume control. biscuit-audio owns the codec, the DSP
# loudness push and the ring feedback, and there is no per-application volume
# anywhere in the UI - so a remembered per-stream volume can only ever be
# something the device set on the user's behalf, handed back later out of
# context.
#
# It has now caused two separate silent-audio faults:
#
#   1. An earcon ducked once came back at the ducked level for every later
#      earcon, permanently, with nothing in any log to say so.
#   2. Worse: the assistant ducks music on the wake word and lifts it on
#      tts_finished. When a run ended some other way the duck leaked, the
#      stream was later recreated at the REMEMBERED ducked volume, and the next
#      duck took 20% of that. Six cycles reached 0.2 ** 6 = 0.000064 of the
#      original - inaudible, and persisted under /root/.local/state, so it
#      survived reboots and looked exactly like "Bluetooth casting is broken".
#
# Turning the memory off makes a duck bounded by definition: whatever happens to
# a stream, the next one starts at unity. The watchdog in biscuit-va-leds bounds
# the live case; this bounds the persistent one, and they are different bugs.
wireplumber.settings = {
  node.stream.restore-props = false
}
