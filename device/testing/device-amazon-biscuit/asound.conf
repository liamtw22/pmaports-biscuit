# Playback is routed through biscuit-dsp.
#
#   apps -> default -> hw:Loopback,0,0  ==(snd-aloop)==  hw:Loopback,1,0
#                                                             |
#                                        biscuit-dsp filters and writes
#                                                             v
#                                                          hw:0,0
#
# Everything that plays audio opens "default" - aplay, bluealsa-aplay,
# biscuit-audio.py - so one insertion point catches all of it without changing
# any of them.
#
# biscuit-dsp applies the speaker correction (+24 dB at 120-300 Hz), the
# per-volume loudness push, the 4-band compressor and the final limiter. It
# also does the stereo-to-mono sum that this file used to do with a route
# table, because it has to work in mono anyway.
#
# IF THERE IS NO SOUND, check biscuit-dsp first: nothing drains the loopback
# without it and playback goes nowhere. `rc-service biscuit-dsp status`, and
# /var/log/biscuit-dsp.log. To bypass the DSP entirely for a test, play to
# biscuit_direct below.

# Several things need the speaker at once: a music stream, an assistant
# response, a notification. A plain plug allows ONE writer and the second
# gets "Resource busy", so they have to be mixed somewhere.
#
# That mixer is PipeWire, and this default hands ALSA clients to it.
#
# It used to be dmix, chosen when PulseAudio was rejected for size. PipeWire
# arrived later for the assistant and for per-stream ducking, and the two then
# fought over hw:Loopback,0,0 - PipeWire opens it directly, dmix opens it as its
# slave, and whichever came second got EBUSY. In practice PipeWire holds the
# device whenever it has played anything recently, so every earcon that went
# through dmix failed for as long as that lasted: press mute, then volume, and
# the volume tone was simply gone. It failed silently too, because sndfile-play
# prints "cannot open audio device (Resource busy)" and still exits 0.
#
# One device, one mixer. Everything now meets in PipeWire, which also has the
# per-stream volume dmix never did, so ducking no longer has to be faked.
#
# The cost is that an earcon played before biscuit-pipewire is up has nowhere to
# go. Every caller that plays one - the boot script, wifi.start, biscuit-setup,
# biscuit-pair-session - runs from local.d or later, well after the service.
pcm.!default {
	type pipewire
}

ctl.!default {
	type pipewire
}

# dmix needs a real hw slave, so it targets the loopback directly rather
# than going through biscuit_dsp_in. Same pinned parameters: snd-aloop
# only constrains the playback side while the capture side is open.
pcm.biscuit_mix {
	type dmix
	ipc_key 3141
	ipc_perm 0666
	slave {
		pcm {
			type hw
			card Loopback
			device 0
			subdevice 0
		}
		format S16_LE
		rate 48000
		channels 2
		period_size 1024
		buffer_size 8192
	}
}

# Parameters are pinned rather than negotiated: snd-aloop only constrains the
# playback side while the capture side is open, so without this an app that
# starts before biscuit-dsp could fix the loopback at a rate the DSP will not
# accept. plug converts whatever the app offers.
pcm.biscuit_dsp_in {
	type plug
	slave {
		pcm {
			type hw
			card Loopback
			device 0
			subdevice 0
		}
		format S16_LE
		rate 48000
		channels 2
	}
}

ctl.!default {
	type hw
	card 0
}

# The codec, with no DSP in the way. The 3.5 mm jack is fed by the left codec
# output alone, so stereo has to be summed before it reaches the DAC or the
# right channel is simply lost.
#
# Playing here bypasses the speaker correction AND the limiter together, which
# is the only safe way to bypass: the correction without the limiter is what
# risks the driver.
pcm.biscuit_direct {
	type route
	slave {
		pcm "hw:0,0"
		channels 2
	}
	ttable.0.0 0.5
	ttable.1.0 0.5
	ttable.0.1 0.5
	ttable.1.1 0.5
}

# Kept under its old name so anything that referenced it still works.
pcm.biscuit_mono_out {
	type route
	slave {
		pcm "hw:0,0"
		channels 2
	}
	ttable.0.0 0.5
	ttable.1.0 0.5
	ttable.0.1 0.5
	ttable.1.1 0.5
}

# Bluetooth call audio (BTCVSD, hw:0,3).
#
# Never open hw:0,3 for playback directly - open this instead. alsa-lib pads
# the end of a drain with silence unless told otherwise, and asks the kernel
# for it through SW_PARAMS; the core then fills that silence into
# runtime->dma_area. mtk-btcvsd allocates no such buffer - it moves data with
# a .copy callback - and ASoC has no fill_silence op to intercept it, so the
# write lands on NULL with the stream lock held and interrupts off. The core
# stops dead, and the mtk watchdog reboots the board 31 s later having
# flushed nothing, which is why the crash looked like it had no cause.
#
# drain_silence 0 declines the padding. Verified: with it, snd_pcm_drain
# returns -EIO honestly and the board survives; without it, four attempts out
# of four killed the machine.
pcm.btsco {
	type hw
	card 0
	device 3
	drain_silence 0
}
