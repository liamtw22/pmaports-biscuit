SectionDevice."Speaker" {
	Comment "Internal speaker"

	Value {
		PlaybackPriority 200
		PlaybackPCM "plug:biscuit_mono_out"
		PlaybackChannels 2
		PlaybackRate 48000
	}

	EnableSequence [
		# DL1 out to both I2S serialisers.
		cset "name='I2S1_CH1 DL1_CH1' 1"
		cset "name='I2S1_CH2 DL1_CH2' 1"
		cset "name='I2S3_CH1 DL1_CH1' 1"
		cset "name='I2S3_CH2 DL1_CH2' 1"

		# Codec DAC through the headphone output mixers, which drive
		# the speaker amplifier on this board.
		cset "name='HP DAC Playback Switch' 1,1"
		cset "name='HPL Output Mixer L_DAC Switch' 0"
		cset "name='HPR Output Mixer R_DAC Switch' 1"

		# 127 is 0 dB on this control (min 0 = -63.5 dB, 0.5 dB steps).
		# Stock never sets it at all and takes the codec default, and its
		# policy layer caps at unity (audio_policy.conf max_value_mB 0),
		# so anything above 127 is louder than stock can ever go.
		#
		# 140 (+6.5 dB) was used before this and is audibly louder without
		# being obviously distorted - compared by ear against stock, with
		# the phone at full volume in both cases, so it is genuinely extra
		# output rather than compensation for attenuation somewhere else.
		# Default is deliberately stock; raise this if a louder speaker is
		# wanted, and expect to give up headroom for it. A user-facing
		# control belongs here eventually rather than a hardcoded number.
		cset "name='PCM Playback Volume' 127,127"
		# Two mainline raw-gain steps above the vendor value reproduce stock's
		# physical speaker level. Keep the DSP terminal trim neutral, so this
		# small calibration does not move the limiter thresholds or add digital
		# clipping after MBCL.
		cset "name='HP Driver Gain Volume' 8,8"
	]

	DisableSequence [
		cset "name='HP DAC Playback Switch' 0,0"
		cset "name='HPL Output Mixer L_DAC Switch' 0"
		cset "name='HPR Output Mixer R_DAC Switch' 0"
	]
}

SectionDevice."Mic" {
	Comment "Seven microphone array, aggregated by the dough FPGA"

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
		CaptureChannels 9
		CaptureRate 16000
	}

	EnableSequence [
		# The converters come out of reset muted twice over: a digital
		# mute in the ADC fine gain register, and the analog PGA.
		# The four PGA capture switches are deliberately NOT set here.
		#
		# They are the microphone mute, and biscuit-audio.service owns
		# them: it turns them off when the mute button is pressed and
		# lights the LED on GPIO87. While this sequence set them to 1,1,
		# anything that reapplied the UCM - restore-a2dp.ps1, or any
		# capture path that re-runs it - silently unmuted the array
		# while the LED stayed red, which is worse than having no mute
		# button at all.
		#
		# The converters come out of reset muted, so the service turning
		# them on at startup is what makes capture work. If the service
		# is not running, expect silence rather than a live microphone -
		# the safe way round.
		# 70 is 35 dB (min 0 = 0 dB, 0.5 dB steps, max 80 = 40 dB).
		#
		# This is a DELIBERATE 15 dB ABOVE STOCK, which sets 40 (20 dB) in
		# /system/etc/audio_init.sh. Stock can afford to capture that
		# quietly because Alexa's stack does beamforming and gain in
		# software downstream; audio_effects.conf shows Android's own
		# pre-processing framework is entirely unused, so that work
		# happens in Amazon's closed audio path. We have no equivalent,
		# so the gain has to come from the ADCs.
		#
		# Measured on Device #1, speaking normally:
		#   PGA 40 (20 dB)  speech peaks -34 dBFS, barely above ambient
		#   PGA 70 (35 dB)  speech peaks -5 to -18 dBFS
		#   PGA 80 (40 dB)  + ADC digital +12 dB, AGC off: current
		#
		# The noise floor rises much more slowly than the signal - about
		# 8 dB across a 20 dB gain increase - so this improves SNR rather
		# than just making everything louder.
		#
		# 80 rather than 70 because the AGC below is off and its gain has
		# to be made up here. That swap is the whole point: the AGC was
		# allowed +40 dB against a -5.5 dBFS target and clipped 2.46% of
		# samples during every spoken wake word. With fixed gain that is
		# 0.074%, the noise floor is 13 dB lower, speech SNR is 5.7 dB
		# better, and wake-word detection with music playing went from
		# 74% to 100%. Do not lower PGA or the ADC volume below without
		# re-measuring: the AGC supplies ~49 dB, and turning it off
		# without replacing that gain drops capture to -67 dBFS, which
		# looks exactly like dead hardware.
		# 40 (20 dB) with the digital stage at 0 dB - stock's registers exactly
		# (APGA 0x28, DigVol 0x00, FGA 0x00, MICBIAS 2.5 V), verified at the chip.
		#
		# Chosen on HEADROOM, not on recall. Paired 50-utterance trials at 1 m /
		# 45 degrees, one capture processed into every path, interferer present:
		#
		#              centre recall   rail samples   peak
		#     20 dB       100%              0        -10.9 dBFS
		#     40 dB       100%         10,072          0.0 dBFS
		#
		# Recall is at ceiling either way; 40 dB buys nothing and clips speech.
		#
		# An earlier revision of this comment claimed 20 dB cost recall (22% vs
		# 100%). That was WRONG and is retracted: those trials ran with the
		# interferer 5 dB ABOVE the talker and clipped 20% of all samples, so
		# they measured clipping, not gain. Both gains score 100% once the
		# interferer is set so the capture does not rail.
		#
		# If you raise this, re-run the trial and check the RAIL COUNT, not just
		# recall - clipping also degrades the beamformer, which needs phase
		# coherence across channels (92% at 40 dB against 96% at 20 dB).
		cset "name='Mic A PGA Capture Volume' 40,40"
		cset "name='Mic B PGA Capture Volume' 40,40"
		cset "name='Mic C PGA Capture Volume' 40,40"
		cset "name='Mic D PGA Capture Volume' 40,40"

		# The microphones sit on the second differential pair. These
		# two bit fields need 3 (0 dB); 0 detaches the input.
		cset "name='Mic A Left Input DIF_2L_3L Capture Volume' 3"
		cset "name='Mic B Left Input DIF_2L_3L Capture Volume' 3"
		cset "name='Mic C Left Input DIF_2L_3L Capture Volume' 3"
		cset "name='Mic D Left Input DIF_2L_3L Capture Volume' 3"
		cset "name='Mic A Right Input DIF_2R_3R Capture Volume' 3"
		cset "name='Mic B Right Input DIF_2R_3R Capture Volume' 3"
		cset "name='Mic C Right Input DIF_2R_3R Capture Volume' 3"
		cset "name='Mic D Right Input DIF_2R_3R Capture Volume' 3"

		# The widget that powers the input path is named for the first
		# differential pair even though the samples arrive on the
		# second. It must transition off to on here, which is why the
		# stored state leaves it off: restoring a value it already
		# holds never rebuilds the routing graph.
		cset "name='Mic A Left Input DIF_1L_1R Capture Switch' 1"
		cset "name='Mic B Left Input DIF_1L_1R Capture Switch' 1"
		cset "name='Mic C Left Input DIF_1L_1R Capture Switch' 1"
		cset "name='Mic D Left Input DIF_1L_1R Capture Switch' 1"
		cset "name='Mic A Right Input DIF_1L_1R Capture Switch' 1"
		cset "name='Mic B Right Input DIF_1L_1R Capture Switch' 1"
		cset "name='Mic C Right Input DIF_1L_1R Capture Switch' 1"
		cset "name='Mic D Right Input DIF_1L_1R Capture Switch' 1"

		# Deselect the first differential pair, as stock does.
		#
		# MUST follow the Capture Switch lines above: enabling that switch
		# rewrites the input-select field back to its default of 2, routing an
		# input the board does not drive into the PGA. The control is INVERTED -
		# 3 selects at 0 dB, 0 deselects. Stock reads 0x3f on page 1 regs
		# 52/54/55/57: one input at 0 dB, everything else deselected.
		#
		# Configuration parity, not a measured win - a paired four-round test of
		# the noise floor gave -0.04 dB, sd 0.56, signs disagreeing.
		cset "name='Mic A Left Input DIF_1L_1R Capture Volume' 0"
		cset "name='Mic B Left Input DIF_1L_1R Capture Volume' 0"
		cset "name='Mic C Left Input DIF_1L_1R Capture Volume' 0"
		cset "name='Mic D Left Input DIF_1L_1R Capture Volume' 0"
		cset "name='Mic A Right Input DIF_1L_1R Capture Volume' 0"
		cset "name='Mic B Right Input DIF_1L_1R Capture Volume' 0"
		cset "name='Mic C Right Input DIF_1L_1R Capture Volume' 0"
		cset "name='Mic D Right Input DIF_1L_1R Capture Volume' 0"

		cset "name='Mic A ADC Volume Control Capture Volume' 24,24"
		cset "name='Mic B ADC Volume Control Capture Volume' 24,24"
		cset "name='Mic C ADC Volume Control Capture Volume' 24,24"
		cset "name='Mic D ADC Volume Control Capture Volume' 24,24"

		# AGC off, matching stock: /system/etc/audio_init.sh sets the
		# analogue PGA and the input routing and never touches AGC.
		#
		# It was enabled here to quieten the noise floor between words,
		# but measurement on Device #1 shows it costs far more than it
		# gives. With AGC on, every channel clipped at full scale and
		# raising the analogue PGA from 10 dB to 20 dB moved the output
		# by about 1 dB - the AGC simply cancelled the gain and then
		# saturated. With it off, the same change gives the expected
		# ~10 dB and ambient peaks sit near -36 dBFS instead of pinned.
		#
		# If the floor is too hissy for a given use, prefer lowering the
		# PGA to fixing it with compression.
		cset "name='Mic A AGC Capture Switch' 0"
		cset "name='Mic B AGC Capture Switch' 0"
		cset "name='Mic C AGC Capture Switch' 0"
		cset "name='Mic D AGC Capture Switch' 0"


		# Second order high pass in each ADC's miniDSP, matching stock.
		# Without it the converters pass DC straight through, and the
		# electret bias leaves an offset that the PGA then amplifies.
		# Measured before this was set, the offset per channel ran from
		# -55 to -28 dBFS and differed in SIGN between channels; on the
		# worst channel it was as large as the entire signal, so a quiet
		# room read as -27 dBFS of "level" that was not sound.
		#
		# This is NOT a clipping fix - 4% of full scale costs 0.4 dB of
		# headroom. What it breaks is everything assuming a zero-mean
		# signal: the beamformer summing channels whose offsets differ in
		# sign, correlation steering, AEC adaptation, and any RMS level
		# detector, which reads a constant offset as signal energy.
		#
		# The biquad only exists from processing block PRB_R2 up. The
		# converters reset into PRB_R1, whose sole filter is the first
		# order IIR, so the block must be selected first. Kernel r219
		# adds both controls; with an older kernel these csets do not
		# exist and the whole sequence fails, so the two ship together.
		cset "name='Mic A ADC Processing Block' 2"
		cset "name='Mic B ADC Processing Block' 2"
		cset "name='Mic C ADC Processing Block' 2"
		cset "name='Mic D ADC Processing Block' 2"

		# First order IIR left flat. Under PRB_R2 it sits in series with
		# the biquad, and stock leaves it at unity rather than cascading
		# a second high pass.
		cset "name='Mic A Left ADC IIR Coefficients N0 N1 D1' 32767,0,0"
		cset "name='Mic B Left ADC IIR Coefficients N0 N1 D1' 32767,0,0"
		cset "name='Mic C Left ADC IIR Coefficients N0 N1 D1' 32767,0,0"
		cset "name='Mic D Left ADC IIR Coefficients N0 N1 D1' 32767,0,0"
		cset "name='Mic A Right ADC IIR Coefficients N0 N1 D1' 32767,0,0"
		cset "name='Mic B Right ADC IIR Coefficients N0 N1 D1' 32767,0,0"
		cset "name='Mic C Right ADC IIR Coefficients N0 N1 D1' 32767,0,0"
		cset "name='Mic D Right ADC IIR Coefficients N0 N1 D1' 32767,0,0"

		# fc = 24.9 Hz, Q = 0.72, Q15 with N1 and D1 stored HALVED - that
		# is how TI fits |a1| = 1.99 into a signed 16 bit field. Derived
		# from those two parameters rather than copied: the standard
		# bilinear-transform high pass at fc/Q, rounded to Q15, reproduces
		# the vendor's registers exactly. DC gain is exactly zero and both
		# poles sit at radius 0.993233, comfortably stable.
		#
		# Mic D is written for symmetry but SILENTLY HAS NO EFFECT: page 4
		# of the converter at 0x1b reads back zero and ignores writes, so
		# the 7th microphone (capture channel 6) keeps its offset. Stock
		# issues the same writes with no readback, so stock's 7th mic is
		# unfiltered too. Verify by reading the chip over /dev/i2c-0,
		# never with amixer, which reports the cache and always agrees.
		cset "name='Mic A Left ADC Biquad A Coefficients N0 N1 N2 D1 D2' 32546,32990,32546,32545,33210"
		cset "name='Mic B Left ADC Biquad A Coefficients N0 N1 N2 D1 D2' 32546,32990,32546,32545,33210"
		cset "name='Mic C Left ADC Biquad A Coefficients N0 N1 N2 D1 D2' 32546,32990,32546,32545,33210"
		cset "name='Mic D Left ADC Biquad A Coefficients N0 N1 N2 D1 D2' 32546,32990,32546,32545,33210"
		cset "name='Mic A Right ADC Biquad A Coefficients N0 N1 N2 D1 D2' 32546,32990,32546,32545,33210"
		cset "name='Mic B Right ADC Biquad A Coefficients N0 N1 N2 D1 D2' 32546,32990,32546,32545,33210"
		cset "name='Mic C Right ADC Biquad A Coefficients N0 N1 N2 D1 D2' 32546,32990,32546,32545,33210"
		cset "name='Mic D Right ADC Biquad A Coefficients N0 N1 N2 D1 D2' 32546,32990,32546,32545,33210"
	]

	DisableSequence [
		cset "name='Mic A Left Input DIF_1L_1R Capture Switch' 0"
		cset "name='Mic B Left Input DIF_1L_1R Capture Switch' 0"
		cset "name='Mic C Left Input DIF_1L_1R Capture Switch' 0"
		cset "name='Mic D Left Input DIF_1L_1R Capture Switch' 0"
		cset "name='Mic A Right Input DIF_1L_1R Capture Switch' 0"
		cset "name='Mic B Right Input DIF_1L_1R Capture Switch' 0"
		cset "name='Mic C Right Input DIF_1L_1R Capture Switch' 0"
		cset "name='Mic D Right Input DIF_1L_1R Capture Switch' 0"
	]
}

SectionDevice."Headphones" {
	Comment "3.5 mm jack, mono"

	Value {
		PlaybackPriority 300
		PlaybackPCM "plug:biscuit_mono_out"
		PlaybackChannels 2
		PlaybackRate 48000
		JackControl "Headphone Jack"
	}

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		# Stock drives the jack from BOTH codec outputs: audio_device.xml
		# ext_headphone_output sets Right Channel Only = Off, where the
		# speaker path sets it On. With only HPL enabled a stereo plug
		# gets one ear.
		#
		# The content is still a mono sum, because biscuit_mono_out in
		# asound.conf folds L+R into both channels. That is a separate
		# question from routing: to get true stereo out of the jack the
		# Headphones device needs its own non-summing PCM, which the
		# speaker cannot use since it is physically one driver.
		cset "name='HP DAC Playback Switch' 1,1"
		cset "name='HPL Output Mixer L_DAC Switch' 1"
		cset "name='HPR Output Mixer R_DAC Switch' 1"
		# Stock: PCM left at the codec default and the analogue driver
		# 5 dB hotter than the speaker path (audio_device.xml,
		# ext_headphone_output: HP Driver Gain Volume 11 against the
		# speaker's 6). 11 is +5 dB; min 0 = -6 dB in 1 dB steps.
		cset "name='PCM Playback Volume' 127,127"
		cset "name='HP Driver Gain Volume' 11,11"
	]

	DisableSequence [
		cset "name='HPL Output Mixer L_DAC Switch' 0"
	]
}
